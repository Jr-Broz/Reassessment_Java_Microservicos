services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mongo:
    image: mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodata:/data/db

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} # liga a senha do .env pq por padrao sobe sem senha
    ports:
      - "${REDIS_PORT:-6379}:6379"

  app:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      MONGO_HOST: mongo
      REDIS_HOST: redis
      POSTGRES_PORT: "5432"
      MONGO_PORT: "27017"
      REDIS_PORT: "6379"
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - mongo
      - redis
    restart: on-failure

volumes:
  pgdata:
  mongodata: