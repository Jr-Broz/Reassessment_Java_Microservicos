spring:
  application:
    name: reassessment

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  mongodb:
    uri: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB}?authSource=admin

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

  cache:
    type: redis
    redis:
      time-to-live: ${PAINEL_CACHE_TTL:30s}

  sql:
    init:
      mode: ${SQL_INIT_MODE:always} 

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true # so roda dps q o forem geradas as tabelas, se n ele roda antes e o insert falha
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

jwt:
  secret: ${JWT_SECRET}
  expiracao-minutos: ${JWT_EXPIRACAO_MINUTOS:60}